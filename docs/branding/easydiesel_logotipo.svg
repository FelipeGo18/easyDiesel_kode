<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none">
<!--
  easyDiesel · Logotipo completo v2.1
  ══════════════════════════════════════════════════════
  IDs para animar:
    #mark         → isotipo completo
    #hex-bg       → fondo hexágono
    #hex-stroke   → borde hex (para draw: dasharray="280")
    #ticks        → marcas laterales
    #drop         → gota completa
    #drop-fill    → cuerpo gota
    #drop-shine   → reflejo
    #word-easy    → texto "easy"
    #word-diesel  → texto "DIESEL"
    #separator    → línea divisora
  ══════════════════════════════════════════════════════
-->
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans:wght@300;400&amp;display=swap');
  </style>
  <radialGradient id="dg" cx="38%" cy="28%" r="70%">
    <stop offset="0%"   stop-color="#FFD580"/>
    <stop offset="50%"  stop-color="#F5A623"/>
    <stop offset="100%" stop-color="#AA6A00"/>
  </radialGradient>
  <radialGradient id="hbg" cx="50%" cy="38%" r="62%">
    <stop offset="0%"   stop-color="#1e1100"/>
    <stop offset="100%" stop-color="#060400"/>
  </radialGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="b"/>
    <feFlood flood-color="#F5A623" flood-opacity="0.4" result="c"/>
    <feComposite in="c" in2="b" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- ═══════════════════════════════════
     ISOTIPO (100×100)
═══════════════════════════════════ -->
<g id="mark">
  <path id="hex-bg"
    d="M50 5 L91 27.5 L91 72.5 L50 95 L9 72.5 L9 27.5 Z"
    fill="url(#hbg)"/>
  <!-- Ticks (detrás del borde) -->
  <g id="ticks">
    <line x1="9"  y1="44" x2="22" y2="44" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <line x1="9"  y1="58" x2="22" y2="58" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <line x1="91" y1="44" x2="78" y2="44" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <line x1="91" y1="58" x2="78" y2="58" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
  </g>
  <!-- Borde hex (encima de ticks) -->
  <path id="hex-stroke"
    d="M50 5 L91 27.5 L91 72.5 L50 95 L9 72.5 L9 27.5 Z"
    stroke="#F5A623" stroke-width="2.2" fill="none"
    stroke-linejoin="miter"/>
  <!-- Gota -->
  <g id="drop">
    <path id="drop-fill"
      d="M50 21 C50 21 34 43 34 57 C34 67.5 41.3 76 50 76 C58.7 76 66 67.5 66 57 C66 43 50 21 50 21 Z"
      fill="url(#dg)" filter="url(#glow)"/>
    <path id="drop-shine"
      d="M44 38 C42.5 44 42 50 43 56"
      stroke="white" stroke-width="1.8"
      stroke-linecap="round" fill="none" opacity="0.28"/>
  </g>
</g>

<!-- ═══════════════════════════════════
     WORDMARK "easy" — DM Sans Light
═══════════════════════════════════ -->
<text id="word-easy"
  x="112" y="48"
  font-family="'DM Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
  font-weight="400"
  font-size="20"
  letter-spacing="1"
  fill="#888888">easy</text>

<!-- ═══════════════════════════════════
     Separador
═══════════════════════════════════ -->
<line id="separator"
  x1="112" y1="56"
  x2="200" y2="56"
  stroke="#F5A623" stroke-width="0.7" opacity="0.35"/>

<!-- ═══════════════════════════════════
     WORDMARK "DIESEL" — Bebas Neue
═══════════════════════════════════ -->
<text id="word-diesel"
  x="112" y="80"
  font-family="'Bebas Neue', 'Impact', 'Arial Narrow', sans-serif"
  font-weight="400"
  font-size="28"
  letter-spacing="2"
  fill="#F5A623">DIESEL</text>

</svg>

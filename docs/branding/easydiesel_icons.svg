<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" fill="none">
<!--
  easyDiesel · Icon Set v4
  ══════════════════════════════════════════════════════════════════
  20 íconos en grilla 5×4 con borde hexagonal (sin ticks).
  Todos los íconos centrados en (55,55), safe zone ~30-80 × 25-85.
  ══════════════════════════════════════════════════════════════════
-->

<defs>
  <style>
    .hex    { fill: #0a0700; stroke: #F5A623; stroke-width: 1.4; stroke-linejoin: miter; }
    .s      { stroke: #F5A623; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .s-thin { stroke: #F5A623; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .s-dim  { stroke: #F5A623; stroke-width: 1.2; stroke-linecap: round; fill: none; opacity: 0.4; }
    .f      { fill: #F5A623; }
    .f-bg   { fill: #2a1a00; }
    .lbl    { font-family: monospace; font-size: 9px; fill: #383838; text-anchor: middle; }
  </style>
</defs>


<!-- ════════════════════════  FILA 1  ════════════════════════ -->


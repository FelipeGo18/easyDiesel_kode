worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile        on;
    keepalive_timeout  65;

    # 1. Definimos el bloque upstream (Balanceador de Carga)
    upstream easydiesel_backend {
        # Round Robin por defecto
        server 127.0.0.1:3000;
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
    }

    server {
        # Nginx escuchara en el puerto 8080
        listen 8080;
        server_name localhost;

        # 2. Redirigimos todas las peticiones /api al grupo upstream
        location /api/ {
            proxy_pass http://easydiesel_backend/api/;
            
            # Cabeceras importantes para mantener informacion del cliente original
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # (Opcional) Si despues quieres servir React desde Nginx, iria aqui
        # location / {
        #     root html;
        #     index index.html index.htm;
        # }
    }
}
